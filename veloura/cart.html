<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Bag — Veloura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header id="site-header"></header>

<main>
  <section class="section-tight">
    <div class="wrap">
      <div class="breadcrumb"><a href="index.html">Home</a> / Your Bag</div>
      <h2 style="font-size:32px;margin-bottom:36px;">Your Bag</h2>

      <div class="checkout-grid" id="cartPageRoot"></div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>
<div id="drawer-root"></div>

<script src="js/data.js"></script>
<script src="js/app.js"></script>
<script src="js/cards.js"></script>
<script>
mountChrome(null);
let couponApplied = null;

function renderCartPage(){
  const all = getCart();
  const active = all.filter(c=>!c.saved);
  const saved = all.filter(c=>c.saved);
  const root = document.getElementById("cartPageRoot");

  if(!active.length && !saved.length){
    root.innerHTML = `<div class="empty-state" style="grid-column:1/-1;padding:100px 20px;">
      ${ICONS.bag.replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" width="56" height="56"')}
      <h3 style="margin:16px 0 8px;">Your bag is empty</h3>
      <p>Looks like you haven't added anything yet.</p>
      <a href="shop.html" class="btn btn-primary" style="margin-top:20px;">Continue Shopping</a>
    </div>`;
    return;
  }

  let subtotal = 0;
  const lineRows = active.map((c)=>{
    const idx = all.indexOf(c);
    const p = findProduct(c.id); const linePrice = finalPrice(p)*c.qty; subtotal += linePrice;
    return `<div class="cart-row" style="align-items:flex-start;">
      <a href="product.html?id=${p.id}"><img src="${p.images[0]}" alt=""></a>
      <div class="meta">
        <a href="product.html?id=${p.id}"><h5>${p.name}</h5></a>
        <div class="opts">Size: ${c.size}${c.color?` · Color: <span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${c.color};vertical-align:middle;"></span>`:""}</div>
        <div class="row-bottom">
          <div class="qty-stepper">
            <button onclick="setCartQty(${idx},${c.qty-1})">−</button><span>${c.qty}</span><button onclick="setCartQty(${idx},${c.qty+1})">+</button>
          </div>
          <span class="hangtag">$${linePrice.toFixed(2)}</span>
        </div>
        <div style="display:flex;gap:16px;margin-top:10px;">
          <button class="link-btn" onclick="toggleSaveForLater(${idx})">Save for later</button>
          <button class="link-btn" onclick="removeFromCart(${idx})">Remove</button>
        </div>
      </div>
    </div>`;
  }).join("");

  const savedRows = saved.map((c)=>{
    const idx = all.indexOf(c);
    const p = findProduct(c.id);
    return `<div class="cart-row">
      <img src="${p.images[0]}" alt="" style="opacity:.7;">
      <div class="meta">
        <h5>${p.name}</h5>
        <div class="opts">Size: ${c.size}</div>
        <div style="display:flex;gap:16px;margin-top:10px;">
          <button class="link-btn" onclick="toggleSaveForLater(${idx})">Move to bag</button>
          <button class="link-btn" onclick="removeFromCart(${idx})">Remove</button>
        </div>
      </div>
    </div>`;
  }).join("");

  const shipping = subtotal > 120 || subtotal===0 ? 0 : 9.5;
  const discount = couponApplied ? subtotal * couponApplied.pct : 0;
  const tax = (subtotal - discount) * 0.07;
  const total = subtotal - discount + tax + shipping;

  root.innerHTML = `
    <div>
      <div class="panel">
        <h3 style="font-size:16px;margin-bottom:10px;">${active.length} item${active.length!==1?'s':''} in your bag</h3>
        ${lineRows || `<p style="color:var(--ink-45);font-size:13.5px;">No active items — check your saved-for-later list below.</p>`}
      </div>
      ${saved.length ? `<div class="panel" style="margin-top:24px;"><h3 style="font-size:16px;margin-bottom:10px;">Saved for later (${saved.length})</h3>${savedRows}</div>` : ""}
    </div>
    <div class="panel" style="position:sticky;top:100px;">
      <h3 style="font-size:18px;margin-bottom:18px;">Order Summary</h3>
      <div class="coupon-row">
        <input type="text" id="couponInput" placeholder="Coupon code">
        <button class="btn btn-outline btn-sm" id="couponBtn">Apply</button>
      </div>
      <p id="couponMsg" style="font-size:12px;color:var(--success);margin:-6px 0 14px;"></p>
      <div class="sum-row"><span>Subtotal</span><span>$${subtotal.toFixed(2)}</span></div>
      ${discount>0 ? `<div class="sum-row" style="color:var(--success);"><span>Discount (${(couponApplied.pct*100)}%)</span><span>−$${discount.toFixed(2)}</span></div>`:""}
      <div class="sum-row"><span>Estimated Tax</span><span>$${tax.toFixed(2)}</span></div>
      <div class="sum-row"><span>Shipping</span><span>${shipping===0?'Free':'$'+shipping.toFixed(2)}</span></div>
      <div class="sum-row total"><span>Total</span><span>$${total.toFixed(2)}</span></div>
      <a href="checkout.html" class="btn btn-primary btn-block" style="margin-top:18px;">Proceed to Checkout</a>
      <a href="shop.html" class="btn btn-ghost btn-block" style="margin-top:6px;">Continue Shopping</a>
      <div style="display:flex;gap:8px;margin-top:18px;color:var(--ink-45);font-size:12px;align-items:center;">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
        Secure checkout · SSL encrypted
      </div>
    </div>`;

  document.getElementById("couponBtn").addEventListener("click", ()=>{
    const val = document.getElementById("couponInput").value.trim().toUpperCase();
    if(val==="VELOURA10"){ couponApplied = {code:val, pct:.1}; document.getElementById("couponMsg").textContent="VELOURA10 applied — 10% off"; }
    else { couponApplied=null; document.getElementById("couponMsg").style.color="var(--danger)"; document.getElementById("couponMsg").textContent="Invalid code — try VELOURA10"; }
    renderCartPage();
  });
}

window.renderCartPage = renderCartPage;
renderCartPage();
initReveal();
</script>
</body>
</html>
